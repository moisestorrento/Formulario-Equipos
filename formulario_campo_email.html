<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Equipos - AES CLESA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .content {
            padding: 20px;
        }

        .form-section {
            margin-bottom: 24px;
        }

        .form-section h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #667eea;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-download {
            background: #10b981;
            color: white;
        }

        .btn-download:active {
            background: #059669;
        }

        .btn-clear {
            background: #f3f4f6;
            color: #666;
        }

        .btn-clear:active {
            background: #e5e7eb;
        }

        .btn-email {
            background: #f59e0b;
            color: white;
            grid-column: 1 / -1;
        }

        .btn-email:active {
            background: #d97706;
        }

        .success-message {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .error-message {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .records-count {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .records-count strong {
            color: #667eea;
            font-size: 16px;
        }

        .email-section {
            background: #f9fafb;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f59e0b;
        }

        .info-box {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #1e40af;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Registro de Equipos</h1>
            <p>AES CLESA - Instalaciones</p>
        </div>

        <div class="content">
            <div class="info-box">
                📝 Llena el formulario, guarda los registros y descarga.
            </div>

            <div class="records-count">
                Registros guardados: <strong id="recordCount">0</strong>
            </div>

            <div class="success-message" id="successMessage">
                ✓ Registro guardado correctamente
            </div>

            <div class="error-message" id="errorMessage">
                ✗ <span id="errorText"></span>
            </div>

            <form id="equipmentForm">
                <!-- EMAIL -->
                <div class="email-section">
                    <label for="adminEmail">📧 Tu correo</label>
                    <input type="email" id="adminEmail" placeholder="tu@email.com">
                </div>

                <!-- INSTALADORES -->
                <div class="form-section">
                    <h2>Instaladores</h2>
                    <div class="form-group">
                        <label for="installer1Name">Instalador 1 (Nombre)</label>
                        <input type="text" id="installer1Name" placeholder="Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label for="installer1Code">Instalador 1 (Código Arnés)</label>
                        <input type="text" id="installer1Code" placeholder="AR-001">
                    </div>
                    <div class="form-group">
                        <label for="installer2Name">Instalador 2 (Nombre)</label>
                        <input type="text" id="installer2Name" placeholder="Carlos López">
                    </div>
                    <div class="form-group">
                        <label for="installer2Code">Instalador 2 (Código Arnés)</label>
                        <input type="text" id="installer2Code" placeholder="AR-002">
                    </div>
                </div>

                <!-- ESCALERA -->
                <div class="form-section">
                    <h2>Escalera</h2>
                    <div class="form-group">
                        <label for="ladderSize">Tamaño</label>
                        <select id="ladderSize">
                            <option value="">Seleccionar...</option>
                            <option value='16"'>16"</option>
                            <option value='20"'>20"</option>
                            <option value='24"'>24"</option>
                            <option value='28"'>28"</option>
                            <option value='32"'>32"</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ladderSerial">Correlativo</label>
                        <input type="text" id="ladderSerial" placeholder="ESC-001">
                    </div>
                    <div class="form-group">
                        <label for="ladderAsset">Activo Fijo</label>
                        <input type="text" id="ladderAsset" placeholder="AF-2024-001">
                    </div>
                </div>

                <!-- EQUIPOS -->
                <div class="form-section">
                    <h2>Herramientas</h2>
                    <div class="form-group">
                        <label for="nicopresadora">Nicopresadora</label>
                        <input type="text" id="nicopresadora" placeholder="AF-2024-050">
                    </div>
                    <div class="form-group">
                        <label for="taladro">Taladro</label>
                        <input type="text" id="taladro" placeholder="AF-2024-051">
                    </div>
                    <div class="form-group">
                        <label for="extintor">Extintor</label>
                        <input type="text" id="extintor" placeholder="EXT-001">
                    </div>
                </div>

                <!-- PROTECCIÓN -->
                <div class="form-section">
                    <h2>Equipos de Protección</h2>
                    <div class="form-group">
                        <label for="guanteClase0">Guante Clase 0</label>
                        <input type="text" id="guanteClase0" placeholder="GC0-001">
                    </div>
                    <div class="form-group">
                        <label for="guanteClase3">Guante Clase 3</label>
                        <input type="text" id="guanteClase3" placeholder="GC3-001">
                    </div>
                    <div class="form-group">
                        <label for="nextTestDate">Próxima Prueba</label>
                        <input type="date" id="nextTestDate">
                    </div>
                </div>

                <!-- OBSERVACIONES -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="notes">Observaciones</label>
                        <input type="text" id="notes" placeholder="Notas adicionales">
                    </div>
                </div>

                <!-- BOTONES -->
                <div class="button-group">
                    <button type="button" class="btn-clear" onclick="limpiar()">Limpiar</button>
                    <button type="submit" class="btn-submit">Guardar</button>
                    <button type="button" class="btn-download" onclick="descargarCSV()">Descargar CSV</button>
                    <button type="button" class="btn-email" onclick="enviarEmail()">Enviar Email</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'equipmentRecords';

        function actualizarConteo() {
            const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            document.getElementById('recordCount').textContent = records.length;
        }

        function mostrarMensaje(tipo, texto) {
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            if (tipo === 'success') {
                successMsg.textContent = '✓ ' + texto;
                successMsg.style.display = 'block';
                errorMsg.style.display = 'none';
                setTimeout(() => successMsg.style.display = 'none', 3000);
            } else {
                document.getElementById('errorText').textContent = texto;
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                setTimeout(() => errorMsg.style.display = 'none', 5000);
            }
        }

        document.getElementById('equipmentForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const record = {
                timestamp: new Date().toISOString(),
                installer1Name: document.getElementById('installer1Name').value,
                installer1Code: document.getElementById('installer1Code').value,
                installer2Name: document.getElementById('installer2Name').value,
                installer2Code: document.getElementById('installer2Code').value,
                ladderSize: document.getElementById('ladderSize').value,
                ladderSerial: document.getElementById('ladderSerial').value,
                ladderAsset: document.getElementById('ladderAsset').value,
                nicopresadora: document.getElementById('nicopresadora').value,
                taladro: document.getElementById('taladro').value,
                extintor: document.getElementById('extintor').value,
                guanteClase0: document.getElementById('guanteClase0').value,
                guanteClase3: document.getElementById('guanteClase3').value,
                nextTestDate: document.getElementById('nextTestDate').value,
                notes: document.getElementById('notes').value
            };

            const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            records.push(record);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

            localStorage.setItem('adminEmail', document.getElementById('adminEmail').value);

            mostrarMensaje('success', 'Registro guardado');
            limpiar();
            actualizarConteo();
        });

        function limpiar() {
            document.getElementById('equipmentForm').reset();
            const savedEmail = localStorage.getItem('adminEmail');
            if (savedEmail) {
                document.getElementById('adminEmail').value = savedEmail;
            }
        }

        function descargarCSV() {
            const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            
            if (records.length === 0) {
                mostrarMensaje('error', 'No hay registros para descargar');
                return;
            }

            // Encabezados
            const headers = [
                'Fecha', 'Hora', 'Instalador 1', 'Código 1', 'Instalador 2', 'Código 2',
                'Escalera', 'Serial Escalera', 'Activo Escalera', 'Nicopresadora', 
                'Taladro', 'Extintor', 'Guante Clase 0', 'Guante Clase 3', 'Próxima Prueba', 'Observaciones'
            ];

            // Datos
            let csv = headers.join(',') + '\n';
            
            records.forEach(r => {
                const fecha = new Date(r.timestamp).toLocaleDateString('es-ES');
                const hora = new Date(r.timestamp).toLocaleTimeString('es-ES');
                
                const fila = [
                    fecha,
                    hora,
                    r.installer1Name || '',
                    r.installer1Code || '',
                    r.installer2Name || '',
                    r.installer2Code || '',
                    r.ladderSize || '',
                    r.ladderSerial || '',
                    r.ladderAsset || '',
                    r.nicopresadora || '',
                    r.taladro || '',
                    r.extintor || '',
                    r.guanteClase0 || '',
                    r.guanteClase3 || '',
                    r.nextTestDate || '',
                    r.notes || ''
                ];
                
                csv += fila.map(cell => `"${cell}"`).join(',') + '\n';
            });

            // Descargar
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `Equipos_${new Date().toLocaleDateString('es-ES')}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            mostrarMensaje('success', 'CSV descargado');
        }

        function enviarEmail() {
            const email = document.getElementById('adminEmail').value;
            
            if (!email) {
                mostrarMensaje('error', 'Ingresa tu correo');
                return;
            }

            if (!email.includes('@')) {
                mostrarMensaje('error', 'Correo inválido');
                return;
            }

            const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (records.length === 0) {
                mostrarMensaje('error', 'No hay registros');
                return;
            }

            // Generar CSV
            descargarCSV();
            
            // Mostrar instrucciones
            mostrarMensaje('success', `Archivo descargado. Envíalo a: ${email}`);
        }

        // Iniciar
        actualizarConteo();
        const savedEmail = localStorage.getItem('adminEmail');
        if (savedEmail) {
            document.getElementById('adminEmail').value = savedEmail;
        }
    </script>
</body>
</html>
